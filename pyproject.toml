# =============================================================================
# pyproject.toml — 整个项目的"身份证" + 所有工具的配置中心
# =============================================================================  
# 以前 Python 项目配置文件到处散落：.flake8、pytest.ini、mypy.ini、setup.py……
# pyproject.toml 把它们全收进一个文件。新同事 clone 下来第一眼就看这。
# ============================================================================= 

# -------------------------------------------------------------------
# [project] — 项目基本信息，pip install 的时候读的就是这
# -------------------------------------------------------------------
[project]
name = "3c-cs-agent"                # pip 包名，也是项目标识
version = "0.1.0"                   # 语义化版本：主版本.次版本.补丁
description = "3C 数码智能客服 Agent 系统"
requires-python = ">=3.12"          # 低于 3.12 装不上。match 语句、泛型语法都要求 3.12
dependencies = [
    "fastapi>=0.110",
    "openai>=1.30",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sentence-transformers>=3.0",
    "langgraph>=1.0",
    "mcp>=1.0",
    "tiktoken>=0.7",
    "redis>=5.0",
    "jieba>=0.42",
    "FlagEmbedding>=1.4",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    "casbin>=1.36",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

# -------------------------------------------------------------------
# [tool.ruff] — ruff 的配置
# ruff 是什么：Rust 写的 Python linter(静态代码检查工具)，速度是 flake8 的 100 倍
# 它干了三件事：
#   ① 检查代码风格（缩进、空格、命名）—— 替代 flake8
#   ② 检查逻辑错误（import 了没用、变量未定义）—— 替代 pyflakes
#   ③ 自动排序 import —— 替代 isort
#   ④ 自动格式化 —— 替代 black
# 一个工具替代四个，团队必备
# -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"            # 告诉 ruff 你的代码运行在 3.12 上
line-length = 120                   # 每行最多 120 字符

[tool.ruff.lint]
# select 选你要启用哪些规则：
#   E  = pycodestyle Error   — 缩进不是 4 的倍数、函数之间没空两行之类的
#   W  = pycodestyle Warning — 行尾有空格、文件末尾没换行之类的
#   F  = pyflakes            — import 了但没用的包、定义了但没用的变量
#   I  = isort               — import 顺序不对（标准库 → 第三方 → 自己的）       
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]  # scripts 需要 sys.path.insert 在 import 之前

[tool.ruff.format]
quote-style = "double"              # 统一双引号，不管你自己写的是单还是双 


# -------------------------------------------------------------------
# [tool.mypy] — mypy 的配置
# mypy 是什么：Python 的静态类型检查器
# Python 本身运行时不管类型标注，mypy 在"跑代码之前"帮你查一遍
# 举例：
#   def search(price: int) -> int:
#       return price * 2
#   search("100")  ← mypy 会报：你传了 str，函数要 int
# -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# strict = false：渐进式类型检查。写了类型标注的地方严查，没写的地方跳过
# 改成 true 的话，每个函数参数、返回值都必须写类型，不然报错
# 项目初期用 false，后面可以慢慢收紧
strict = false
# ignore_missing_imports：第三方库没类型标注的别报错（很多小库没有 py.typed）    
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "mcp.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------
# [tool.pytest.ini_options] — pytest 的配置
# pytest 是什么：Python 测试框架，比自带的 unittest 好用得多
# 测试文件命名 test_xxx.py，函数命名 test_xxx()，放 tests/ 目录
# -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = ["src"]                   # 让测试文件能 import agent / core / config
addopts = "-v --tb=short"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]